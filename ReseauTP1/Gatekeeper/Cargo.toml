[package]
name = "gatekeeper"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
serde = { version = "1.0", features = ["derive"] }
redis = { version = "0.24", features = ["tokio-comp"] }
tokio = { version = "1.42.0", features = ["full"]}
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
axum = "0.7"