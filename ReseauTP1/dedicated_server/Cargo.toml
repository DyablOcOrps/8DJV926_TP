[package]
name = "dedicated_server"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }

bevy = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[[bin]]
name = "dedicated_server"
path = "main.rs"
