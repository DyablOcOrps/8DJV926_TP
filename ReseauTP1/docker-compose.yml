version: '3.8'

services:
  # Le conteneur Redis
  redis:
    image: redis:7-alpine
    container_name: redis-mmorpg
    ports:
      - "6379:6379"

  # L'orchestrateur Rust
  orchestrator:
    image: rust:latest # Version de Rust, s'adapte automatiquement
    container_name: mmorpg-orchestrator
    volumes:
      - .:/usr/src/myapp
      # ATTENTION: Ajout d'une variable d'environnement pour utiliser game socket
      - ${CARGO_REGISTRY_PATH:-./.cargo-cache}:/usr/local/cargo/registry
    working_dir: /usr/src/myapp
    command: cargo run -p orchestrator
    depends_on:
      - redis
    network_mode: "host" # Permet aux composants de se parler sur localhost facilement

  # 3. Le gatekeeper Rust
  gatekeeper:
    image: rust:latest
    container_name: mmorpg-gatekeeper
    
    volumes:
      - .:/usr/src/myapp
      #  ATTENTION: Ajout d'une variable d'environnement pour utiliser game socket
      - ${CARGO_REGISTRY_PATH:-./.cargo-cache}:/usr/local/cargo/registry
    working_dir: /usr/src/myapp
    command: cargo run -p gatekeeper
    depends_on:
      - orchestrator
    ports:
      - "3000:3000"
    network_mode: "host"

  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    container_name: mmorpg-broker
    volumes:
      - .:/usr/src/myapp
      - ${CARGO_REGISTRY_PATH:-./.cargo-cache}:/usr/local/cargo/registry
    working_dir: /usr/src/myapp
    #previous command to add dependencies
    #command: sh -c "apt-get update && apt-get install -y clang cmake build-essential protobuf-compiler libprotobuf-dev && cargo run -p broker"
    command: cargo run -p broker
    depends_on:
      - gatekeeper
    network_mode: "host"

  quadtree:
    build:
      context: .
      dockerfile: quadtree/Dockerfile
    container_name: mmorpg-QuadTree
    volumes:
       - .:/usr/src/myapp
       - ${CARGO_REGISTRY_PATH:-./.cargo-cache}:/usr/local/cargo/registry
    working_dir: /usr/src/myapp
    command: cargo run -p quadtree
    depends_on:
      - broker
    network_mode: "host"
    
